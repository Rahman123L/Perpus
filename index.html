<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="imgs/" rel="shortcut icon" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4.0.0/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.2/dist/cdn.min.js" defer></script>

    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: '#',
                    secondary: '#14b8a6',
                    tertiary: '',
                },
                keyframes: {
                    fadeIn: {
                        '0%': { opacity: 0 },
                        '100%': { opacity: 1 },
                    },
                },
                animation: {
                    fadeIn: "fadeIn 2s forwards",
                },
            },
        },
    };
    </script>

</head>
<body class="bg-[#F5F7FA]">

    <!-- Main Start -->
    <main class="w-[90%] pt-[7rem] mx-auto space-y-3">

        <!-- Tambah -->
        <a href="create.html">
        <button class="w-fit bg-white mx-3 py-2 px-8 group transition transform duration-700 hover:bg-gray-500 rounded-lg focus:scale-[.98] shadow-md shadow-black/5">
            <h1 class="text-xs md:text-sm font-normal transition transform duration-500 text-secondary group-hover:text-[#FFFFFF] group-focus:text-[#FFFFFF] uppercase">Tambah Data Buku</h1>
        </button>
        </a>

        <!-- Table -->
        <section class="scrollbar-x bg-transparent rounded md:rounded-md shadow-md shadow-black/5 pt-2">
            <table class="w-max lg:w-full mx-auto bg-white text-center table-auto">
                <tr class="text-[10px] md:text-xs text-secondary capitalize">
                    <th class="w-[5%] bg-white font-normal py-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">No</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Nomor Buku</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Nama Buku</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Tahun Terbit</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Penulis</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Jumlah</th>
                    <th class="w-[15%] bg-white font-normal p-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">Aksi</th>
                </tr>
                <tr class="odd:bg-white even:bg-[#E8EDF2] text-xs text-black/70 capitalize overflow-visible">
                    <td class="font-normal my-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">1</td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">BA12</h1>
                    </td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">Kebebasan</h1>
                    </td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">2018</td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">Muklis</h1>
                    </td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">3</td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <div class="flex items-center gap-1.5 md:gap-2">
                            <a href="update.html" class="flex items-center gap-2 bg-green-500 py-1.5 px-5 rounded-md">
                                <h1 class="text-[#E8EDF2] font-normal">Ubah</h1>
                            </a>
                            <button type="button" class="flex items-center gap-2 bg-red-500 py-1.5 px-5 rounded-md">
                                <h1 class="text-[#E8EDF2] font-normal">Hapus</h1>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr class="odd:bg-white even:bg-[#E8EDF2] text-xs text-black/70 capitalize overflow-visible">
                    <td class="font-normal my-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">2</td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">BA12</h1>
                    </td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">Kebebasan</h1>
                    </td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">2018</td>
                    <td class="py-3.5 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <h1 class="line-clamp-1 font-normal">Muklis</h1>
                    </td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">3</td>
                    <td class="font-normal m-4 first:pl-4 last:pr-4 last:pl-4 last:relative last:right-0">
                        <div class="flex items-center gap-1.5 md:gap-2">
                            <a href="update.html" class="flex items-center gap-2 bg-green-500 py-1.5 px-5 rounded-md">
                                <h1 class="text-[#E8EDF2] font-normal">Ubah</h1>
                            </a>
                            <button type="button" class="flex items-center gap-2 bg-red-500 py-1.5 px-5 rounded-md">
                                <h1 class="text-[#E8EDF2] font-normal">Hapus</h1>
                            </button>
                        </div>
                    </td>
                </tr>
            </table>
        </section>

        <div class="flex justify-between items-center">
            <a href="#" class="bg-white px-4 py-2 text-gray-700 text-xs md:text-sm rounded-md hover:bg-secondary hover:text-white shadow-md shadow-black/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </a>
        
            <div class="flex items-center gap-3">
                <a href="#" class="hidden px-4 py-2 text-gray-700 text-xs md:text-sm bg-white rounded-md sm:inline hover:bg-secondary hover:text-white shadow-md shadow-black/5">1</a>
                <a href="#" class="px-4 py-2 text-gray-700 text-xs md:text-sm bg-white rounded-md hover:bg-secondary hover:text-white shadow-md shadow-black/5">2</a>
                <a href="#" class="hidden px-4 py-2 text-gray-700 text-xs md:text-sm bg-white rounded-md sm:inline hover:bg-secondary hover:text-white shadow-md shadow-black/5">3</a>
            </div>
        
            <a href="#" class="bg-white px-4 py-2 text-gray-700 text-xs md:text-sm rounded-md hover:bg-secondary hover:text-white shadow-md shadow-black/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                </svg>
            </a>
        </div>
    </main>
    <!-- Main End -->

</body>
</html>

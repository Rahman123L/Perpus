<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create</title>
    <link href="imgs/" rel="shortcut icon" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4.0.0/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.2/dist/cdn.min.js" defer></script>

    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: '#ababab',
                    secondary: '#',
                    tertiary: '',
                },
                keyframes: {
                    fadeIn: {
                        '0%': { opacity: 0 },
                        '100%': { opacity: 1 },
                    },
                },
                animation: {
                    fadeIn: "fadeIn 2s forwards",
                },
            },
        },
    };
    </script>

</head>
<body class="bg-[#F5F7FA]">

    <!-- Main Start -->
    <main class="w-full mt-[1.5rem] flex justify-center p-4 space-y-3">
        <div class="w-full md:w-[30rem] lg:w-[40rem] bg-white p-4 rounded-2xl overflow-hidden">
            <form action="" method="POST" class="grid gap-3 m-3">
                <label>
                    <h1 class="pb-2 text-sm font-semibold text-primary capitalize">Nama Barang</h1>
                    <input type="text" id="" name="" required autocomplete="off" placeholder=". . . . ." class="w-full py-2 px-5 md:px-7 border-[0.5px] bg-transparent text-gray-500 font-medium text-xs border-[#B0B0B0] focus:border-primary rounded-lg focus:outline-none focus:scale-[1.01]">
                </label>

                <label>
                    <h1 class="pb-2 text-sm font-semibold text-primary capitalize">Harga Barang</h1>
                    <input type="text" id="" name="" required autocomplete="off" placeholder=". . . . ." class="w-full py-2 px-5 md:px-7 border-[0.5px] bg-transparent text-gray-500 font-medium text-xs border-[#B0B0B0] focus:border-primary rounded-lg focus:outline-none focus:scale-[1.01]">
                </label>

                <label>
                    <h1 class="pb-2 text-sm font-semibold text-primary capitalize">Jumlah</h1>
                    <input type="text" id="" name="" required autocomplete="off" placeholder=". . . . ." class="w-full py-2 px-5 md:px-7 border-[0.5px] bg-transparent text-gray-500 font-medium text-xs border-[#B0B0B0] focus:border-primary rounded-lg focus:outline-none focus:scale-[1.01]">
                </label>

                <div class="w-full flex flex-wrap justify-between">
                    <button type="submit" class="text-center mt-4 px-16 py-2 group transition transform duration-700 focus:bg-green-500 border-[0.5px] border-[#B0B0B0] hover:bg-gray-500 hover:border-gray-500 focus:border-green-500 rounded-lg focus:scale-[.98]" type="button">
                        <h1 class="text-xs lg:text-sm font-bold transition transform duration-500 text-[#989898] group-hover:text-[#FFFFFF] group-focus:text-[#FFFFFF] uppercase">Tambah</h1>
                    </button>

                    <a href="index.html">
                    <button class="text-center mt-4 px-16 py-2 group transition transform duration-700 focus:bg-red-500 border-[0.5px] border-[#B0B0B0] hover:bg-gray-500 hover:border-gray-500 focus:border-red-500 rounded-lg focus:scale-[.98]" type="button">
                        <h1 class="text-xs lg:text-sm font-bold transition transform duration-500 text-[#989898] group-hover:text-[#FFFFFF] group-focus:text-[#FFFFFF] uppercase">Kembali</h1>
                    </button>
                    </a>
                </div>

            </form>
        </div>
    </main>
    <!-- Main End -->

</body>
</html>
